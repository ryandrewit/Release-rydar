name: Daily Release Rydar Update

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit and push changes back to repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run release fetcher script
        run: python update_releases.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily heavy music releases 🎸 [skip ci]" && git push)
