<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Release Rydar - Heavy Music Radar</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen selection:bg-red-600 selection:text-white pb-16">
    <!-- App Container -->
    <div class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- Header -->
        <header class="flex items-center justify-between border-b border-zinc-800 pb-5 mb-6">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center font-black mono text-xl tracking-tighter shadow-lg shadow-red-600/30">
                    RR
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        Release Rydar <span class="text-xs px-2 py-0.5 rounded-full bg-red-950/80 text-red-400 border border-red-800/50 mono font-semibold">LIVE</span>
                    </h1>
                    <p class="text-xs text-zinc-400">Autonomous Heavy Music Intelligence</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="loadReleases()" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 transition" title="Refresh Feed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </header>

        <!-- Status / Tab Filter Bar -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
            <div class="flex rounded-xl bg-zinc-900 p-1 border border-zinc-800/80 w-full sm:w-auto">
                <button id="tab-recent" onclick="setTab('recent')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition bg-red-600 text-white shadow">
                    Released This Week 🔥
                </button>
                <button id="tab-upcoming" onclick="setTab('upcoming')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white">
                    Upcoming This Month
                </button>
            </div>

            <!-- Search Input -->
            <div class="relative w-full sm:w-64">
                <input type="text" id="searchInput" oninput="filterReleases()" placeholder="Search band or album..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-red-600 transition">
            </div>
        </div>

        <!-- Genre Pill Bar -->
        <div class="flex overflow-x-auto pb-2 mb-6 space-x-2 scrollbar-none">
            <button onclick="filterGenre('All')" id="genre-All" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-100 text-zinc-950">
                All Genres
            </button>
            <button onclick="filterGenre('Hardcore')" id="genre-Hardcore" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Hardcore
            </button>
            <button onclick="filterGenre('Metalcore')" id="genre-Metalcore" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Metalcore
            </button>
            <button onclick="filterGenre('Post-Metal')" id="genre-Post-Metal" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Post-Metal
            </button>
            <button onclick="filterGenre('Doom Metal')" id="genre-Doom Metal" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Doom Metal
            </button>
            <button onclick="filterGenre('Death Metal')" id="genre-Death Metal" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Death Metal
            </button>
            <button onclick="filterGenre('Math Metal')" id="genre-Math Metal" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Math Metal
            </button>
            <button onclick="filterGenre('Prog Metal')" id="genre-Prog Metal" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Prog Metal
            </button>
            <button onclick="filterGenre('Metal')" id="genre-Metal" class="genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200">
                Metal
            </button>
        </div>

        <!-- Release Grid -->
        <div id="releaseGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamically populated from releases.json -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-zinc-500 text-sm">No releases found matching your criteria.</p>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let allReleases = [];
        let currentTab = 'recent';
        let currentGenre = 'All';

        async function loadReleases() {
            try {
                const response = await fetch('./releases.json?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to load releases.json');
                allReleases = await response.json();
                renderReleases();
            } catch (err) {
                console.error("Error fetching releases:", err);
                document.getElementById('releaseGrid').innerHTML = `
                    <div class="col-span-full p-6 bg-red-950/40 border border-red-900/50 rounded-2xl text-center">
                        <p class="text-red-400 text-sm font-medium">Could not load releases data.</p>
                        <p class="text-zinc-500 text-xs mt-1">Make sure releases.json is in your repository root.</p>
                    </div>
                `;
            }
        }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('tab-recent').className = tab === 'recent' 
                ? 'flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition bg-red-600 text-white shadow' 
                : 'flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white';
            document.getElementById('tab-upcoming').className = tab === 'upcoming' 
                ? 'flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition bg-red-600 text-white shadow' 
                : 'flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white';
            renderReleases();
        }

        function filterGenre(genre) {
            currentGenre = genre;
            document.querySelectorAll('.genre-pill').forEach(btn => {
                const isSelected = btn.textContent.trim().toLowerCase() === (genre === 'All' ? 'all genres' : genre.toLowerCase());
                if (isSelected) {
                    btn.className = 'genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-100 text-zinc-950';
                } else {
                    btn.className = 'genre-pill px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700 hover:text-zinc-200';
                }
            });
            renderReleases();
        }

        function renderReleases() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('releaseGrid');
            const emptyState = document.getElementById('emptyState');

            const filtered = allReleases.filter(item => {
                const matchesTab = item.status === currentTab;
                const matchesGenre = currentGenre === 'All' || item.genre.toLowerCase().includes(currentGenre.toLowerCase());
                const matchesSearch = item.band.toLowerCase().includes(query) || item.album.toLowerCase().includes(query);
                return matchesTab && matchesGenre && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(item => {
                const spotifyUrl = `https://open.spotify.com/search/${encodeURIComponent(item.band + ' ' + item.album)}`;
                const artHtml = item.artUrl 
                    ? `<img src="${item.artUrl}" alt="${item.album}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`
                    : `<div class="w-full h-full bg-gradient-to-br ${item.artBg || 'from-zinc-900 to-black'} flex items-center justify-center font-mono font-extrabold text-2xl text-zinc-700 tracking-tighter">${item.icon || item.band.substring(0,2).toUpperCase()}</div>`;

                return `
                    <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl overflow-hidden flex flex-col hover:border-zinc-700 transition group">
                        <div class="relative aspect-square bg-zinc-950 overflow-hidden">
                            ${artHtml}
                            <div class="absolute top-3 left-3 bg-zinc-950/80 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-semibold text-zinc-300 uppercase tracking-wider border border-zinc-800">
                                ${item.type || 'Album'}
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-1 justify-between">
                            <div>
                                <div class="flex items-center justify-between text-xs text-zinc-400 mb-1">
                                    <span class="font-medium text-red-500">${item.genre}</span>
                                    <span>${item.date}</span>
                                </div>
                                <h3 class="font-bold text-white text-base leading-snug group-hover:text-red-400 transition">${item.band}</h3>
                                <p class="text-zinc-400 text-sm mt-0.5 line-clamp-1">${item.album}</p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-zinc-800/60 flex items-center justify-between">
                                <a href="${spotifyUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300 transition">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.72.48-1.08.24-2.999-1.8-6.78-2.22-11.22-1.24-.42.06-.84-.18-.9-.6-.06-.42.18-.84.6-.9 4.86-1.08 9.06-.6 12.48 1.56.36.24.48.72.24 1.04zm1.56-3.48c-.3.48-.9.6-1.38.3-3.42-2.1-8.58-2.71-12.6-1.48-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.62-1.38 10.38-.72 14.34 1.74.48.3.6 1.02.3 1.42zm.12-3.66C15.24 7.92 8.82 7.68 5.16 8.82c-.66.18-1.38-.18-1.56-.84-.18-.66.18-1.38.84-1.56 4.2-1.26 11.4-0.96 15.6 1.5.6.36.78 1.14.42 1.74-.36.6-1.14.78-1.74.42z"/></svg>
                                    <span>Spotify Search</span>
                                </a>
                                <span class="text-[10px] text-zinc-500 mono">${item.status.toUpperCase()}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterReleases() {
            renderReleases();
        }

        // Initialize on load
        loadReleases();

        // Register Service Worker for PWA installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registered!', reg))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
