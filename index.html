<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Release Rydar - Heavy Music Radar</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .release-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }
        @media (min-width: 640px) {
            .release-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (min-width: 1024px) {
            .release-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }
        @media (min-width: 1280px) {
            .release-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen selection:bg-red-600 selection:text-white pb-16">

    <!-- MAIN VIEW CONTAINER -->
    <div id="main-view" class="max-w-7xl mx-auto px-4 py-5">
        <!-- Header -->
        <header class="flex items-center justify-between border-b border-zinc-800 pb-4 mb-5">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-[#121214] border border-zinc-800/80 flex items-center justify-center font-serif font-black text-xs text-zinc-200 tracking-wider shadow-inner">
                    RR
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2 flex-wrap">
                        Release Rydar 
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-red-950/80 text-red-400 border border-red-800/50 mono font-semibold">LIVE</span>
                        <span id="currentMonthBadge" class="text-[11px] font-mono font-medium text-zinc-400 bg-zinc-900 border border-zinc-800 px-2.5 py-0.5 rounded-md"></span>
                    </h1>
                    <p class="text-[11px] text-zinc-400">Bennet style heavy music release list</p>
                </div>
            </div>
        </header>

        <!-- Status / Tab Filter Bar -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-5">
            <div class="flex rounded-xl bg-zinc-900 p-1 border border-zinc-800/80 w-full sm:w-auto">
                <button id="tab-recent" onclick="setTab('recent')" class="flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-medium transition bg-red-600 text-white shadow">
                    New Releases 🔥
                </button>
                <button id="tab-upcoming" onclick="setTab('upcoming')" class="flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-medium transition text-zinc-400 hover:text-white">
                    Upcoming This Month
                </button>
            </div>
            <div class="relative w-full sm:w-60">
                <input type="text" id="searchInput" oninput="filterReleases()" placeholder="Search band or album..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-red-600 transition">
            </div>
        </div>

        <!-- Genre Pill Bar -->
        <div class="flex overflow-x-auto pb-2 mb-5 space-x-2 scrollbar-none">
            <button onclick="filterGenre('All')" id="genre-All" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-100 text-zinc-950">All Genres</button>
            <button onclick="filterGenre('Hardcore')" id="genre-Hardcore" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Hardcore</button>
            <button onclick="filterGenre('Metalcore')" id="genre-Metalcore" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Metalcore</button>
            <button onclick="filterGenre('Post-Metal')" id="genre-Post-Metal" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Post-Metal</button>
            <button onclick="filterGenre('Doom Metal')" id="genre-Doom Metal" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Doom Metal</button>
            <button onclick="filterGenre('Death Metal')" id="genre-Death Metal" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Death Metal</button>
            <button onclick="filterGenre('Math Metal')" id="genre-Math Metal" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Math Metal</button>
            <button onclick="filterGenre('Prog Metal')" id="genre-Prog Metal" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Prog Metal</button>
            <button onclick="filterGenre('Metal')" id="genre-Metal" class="genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800">Metal</button>
        </div>

        <!-- Release Grid -->
        <div id="releaseGrid" class="release-grid"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-zinc-500 text-xs">No releases found matching your criteria.</p>
        </div>
    </div>


    <!-- ALBUM DETAIL & REVIEW VIEW -->
    <div id="detail-view" class="hidden max-w-3xl mx-auto px-4 py-5">
        <button onclick="backToMain()" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-zinc-400 hover:text-white mb-6 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            <span>Back to Releases</span>
        </button>
        <div id="detailContent" class="space-y-6"></div>
    </div>


    <!-- Application Script -->
    <script>
        const SUPABASE_URL = 'https://aetokzwyrcferaxjmzmu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XmqY7EqijK4Z3m3GcQ7fbQ_6EdV1o_v';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allReleases = [];
        let currentTab = 'recent';
        let currentGenre = 'All';
        let activeAlbumId = null;

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const now = new Date();
        document.getElementById('currentMonthBadge').textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;

        async function loadReleases() {
            try {
                const response = await fetch('./releases.json?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to load releases.json');
                allReleases = await response.json();
                renderReleases();
                
                // Trigger background artwork enrichment for any missing art
                enrichMissingArtworks();
            } catch (err) {
                console.error("Error fetching releases:", err);
            }
        }

        async function enrichMissingArtworks() {
            for (let item of allReleases) {
                if (!item.artUrl) {
                    const cacheKey = `art_${item.band}_${item.album}`.toLowerCase().replace(/[^a-z0-9]/g, '_');
                    const cachedUrl = localStorage.getItem(cacheKey);
                    
                    if (cachedUrl) {
                        item.artUrl = cachedUrl;
                        updateCardArtInPlace(item.id, cachedUrl, item.band);
                        continue;
                    }

                    try {
                        const query = encodeURIComponent(`artist:"${item.band}" release:"${item.album}"`);
                        const res = await fetch(`https://musicbrainz.org/ws/2/release/?query=${query}&fmt=json`, {
                            headers: { 'User-Agent': 'ReleaseRydar/1.0 (admin@releaserydar.app)' }
                        });
                        
                        if (res.ok) {
                            const data = await res.json();
                            if (data.releases && data.releases.length > 0) {
                                const mbid = data.releases[0].id;
                                const artUrl = `https://coverartarchive.org/release/${mbid}/front`;
                                
                                item.artUrl = artUrl;
                                localStorage.setItem(cacheKey, artUrl);
                                updateCardArtInPlace(item.id, artUrl, item.band);
                            }
                        }
                        // Respect MusicBrainz rate limit (1 request per second)
                        await new Promise(r => setTimeout(r, 1100));
                    } catch (err) {
                        console.warn("Could not fetch artwork for", item.band, item.album);
                    }
                }
            }
        }

        function updateCardArtInPlace(id, url, bandName) {
            const container = document.getElementById(`art-container-${id}`);
            if (container) {
                const cacheKey = `art_${bandName}`.toLowerCase().replace(/[^a-z0-9]/g, '_');
                container.innerHTML = `<img src="${url}" alt="" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="handleImageError(this, '${bandName.replace(/'/g, "\\'")}', '${cacheKey}')">`;
            }
        }

        function handleImageError(imgEl, bandName, cacheKey) {
            if (cacheKey) localStorage.removeItem(cacheKey);
            const parent = imgEl.parentElement;
            const initials = bandName.substring(0, 2).toUpperCase();
            parent.innerHTML = `<div class="w-full h-full bg-gradient-to-br from-zinc-900 to-black flex items-center justify-center font-mono font-extrabold text-xl text-zinc-700 tracking-tighter">${initials}</div>`;
        }

        function handleDetailImageError(imgEl, bandName) {
            const parent = imgEl.parentElement;
            const initials = bandName.substring(0, 2).toUpperCase();
            parent.innerHTML = `<div class="w-32 h-32 rounded-xl bg-gradient-to-br from-zinc-900 to-black flex items-center justify-center font-mono font-extrabold text-3xl text-zinc-700 shadow-lg border border-zinc-800">${initials}</div>`;
        }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('tab-recent').className = tab === 'recent' ? 'flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-medium transition bg-red-600 text-white shadow' : 'flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-medium transition text-zinc-400 hover:text-white';
            document.getElementById('tab-upcoming').className = tab === 'upcoming' ? 'flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-medium transition bg-red-600 text-white shadow' : 'flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-xs font-medium transition text-zinc-400 hover:text-white';
            renderReleases();
        }

        function filterGenre(genre) {
            currentGenre = genre;
            document.querySelectorAll('.genre-pill').forEach(btn => {
                const isSelected = btn.textContent.trim().toLowerCase() === (genre === 'All' ? 'all genres' : genre.toLowerCase());
                btn.className = isSelected 
                    ? 'genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-100 text-zinc-950'
                    : 'genre-pill px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition bg-zinc-900 text-zinc-400 border border-zinc-800';
            });
            renderReleases();
        }

        function renderReleases() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('releaseGrid');
            const emptyState = document.getElementById('emptyState');
            const todayStr = new Date().toISOString().split('T')[0];

            let filtered = allReleases.filter(item => {
                const calcStatus = item.date > todayStr ? 'upcoming' : 'recent';
                const matchesTab = calcStatus === currentTab;
                const matchesGenre = currentGenre === 'All' || item.genre.toLowerCase().includes(currentGenre.toLowerCase());
                const matchesSearch = item.band.toLowerCase().includes(query) || item.album.toLowerCase().includes(query);
                return matchesTab && matchesGenre && matchesSearch;
            });

            // SORT: Newest to Oldest (Descending date order)
            filtered.sort((a, b) => b.date.localeCompare(a.date));

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(item => {
                const isUpcoming = item.date > todayStr;
                const statusBadgeHtml = isUpcoming
                    ? `<span class="bg-amber-950/80 text-amber-400 border border-amber-800/50 text-[9px] font-mono px-2 py-0.5 rounded-full font-semibold">Upcoming</span>`
                    : `<span class="bg-emerald-950/80 text-emerald-400 border border-emerald-800/50 text-[9px] font-mono px-2 py-0.5 rounded-full font-semibold">Released</span>`;

                const cacheKey = `art_${item.band}_${item.album}`.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const artHtml = item.artUrl 
                    ? `<img src="${item.artUrl}" alt="${item.album}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="handleImageError(this, '${item.band.replace(/'/g, "\\'")}', '${cacheKey}')">`
                    : `<div class="w-full h-full bg-gradient-to-br from-zinc-900 to-black flex items-center justify-center font-mono font-extrabold text-xl text-zinc-700 tracking-tighter">${item.band.substring(0,2).toUpperCase()}</div>`;

                return `
                    <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-xl overflow-hidden flex flex-col hover:border-zinc-700 transition group shadow-sm cursor-pointer" onclick="openAlbumDetail(${item.id})">
                        <div class="relative w-full aspect-square bg-zinc-950 overflow-hidden">
                            <div id="art-container-${item.id}" class="w-full h-full">
                                ${artHtml}
                            </div>
                            <div class="absolute top-2 right-2 pointer-events-none">${statusBadgeHtml}</div>
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center pointer-events-none">
                                <span class="bg-red-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow-lg">View & Review</span>
                            </div>
                        </div>
                        <div class="p-3 flex flex-col flex-1 justify-between">
                            <div>
                                <div class="flex items-center justify-between text-[10px] text-zinc-400 mb-1">
                                    <span class="font-medium text-red-500 truncate max-w-[65%]" title="${item.genre}">${item.genre}</span>
                                    <span class="mono">${item.date}</span>
                                </div>
                                <h3 class="font-bold text-white text-xs leading-tight group-hover:text-red-400 transition line-clamp-1" title="${item.band}">${item.band}</h3>
                                <p class="text-zinc-400 text-[11px] mt-0.5 line-clamp-1" title="${item.album}">${item.album}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterReleases() { renderReleases(); }

        async function openAlbumDetail(id) {
            activeAlbumId = id;
            const item = allReleases.find(r => r.id === id);
            if (!item) return;

            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            window.scrollTo(0, 0);

            const artHtml = item.artUrl 
                ? `<img src="${item.artUrl}" alt="${item.album}" class="w-32 h-32 rounded-xl object-cover shadow-lg border border-zinc-800" onerror="handleDetailImageError(this, '${item.band.replace(/'/g, "\\'")}')">`
                : `<div class="w-32 h-32 rounded-xl bg-gradient-to-br from-zinc-900 to-black flex items-center justify-center font-mono font-extrabold text-3xl text-zinc-700 shadow-lg border border-zinc-800">${item.band.substring(0,2).toUpperCase()}</div>`;

            const spotifyUrl = `https://open.spotify.com/search/${encodeURIComponent(item.band + ' ' + item.album)}`;

            let reviews = [];
            try {
                const { data, error } = await supabaseClient
                    .from('reviews')
                    .select('*')
                    .eq('album_id', String(id))
                    .order('created_at', { ascending: false });
                if (!error && data) reviews = data;
            } catch (err) {
                console.error("Error fetching reviews:", err);
            }

            document.getElementById('detailContent').innerHTML = `
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5 bg-zinc-900/60 p-5 rounded-2xl border border-zinc-800">
                    ${artHtml}
                    <div class="text-center sm:text-left flex-1">
                        <span class="text-xs font-semibold text-red-500 uppercase tracking-wider">${item.genre} • ${item.type || 'Album'}</span>
                        <h2 class="text-xl font-extrabold text-white mt-1">${item.band}</h2>
                        <p class="text-zinc-300 text-sm mt-0.5">${item.album}</p>
                        <p class="text-xs text-zinc-500 mono mt-2">Release Date: ${item.date}</p>
                        <div class="mt-4">
                            <a href="${spotifyUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1.5 text-xs font-semibold bg-emerald-600/20 text-emerald-400 border border-emerald-800/50 px-3 py-1.5 rounded-lg hover:bg-emerald-600/30 transition">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.72.48-1.08.24-2.999-1.8-6.78-2.22-11.22-1.24-.42.06-.84-.18-.9-.6-.06-.42.18-.84.6-.9 4.86-1.08 9.06-.6 12.48 1.56.36.24.48.72.24 1.04zm1.56-3.48c-.3.48-.9.6-1.38.3-3.42-2.1-8.58-2.71-12.6-1.48-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.62-1.38 10.38-.72 14.34 1.74.48.3.6 1.02.3 1.42zm.12-3.66C15.24 7.92 8.82 7.68 5.16 8.82c-.66.18-1.38-.18-1.56-.84-.18-.66.18-1.38.84-1.56 4.2-1.26 11.4-0.96 15.6 1.5.6.36.78 1.14.42 1.74-.36.6-1.14.78-1.74.42z"/></svg>
                                <span>Listen on Spotify</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800">
                    <h3 class="text-sm font-bold text-white mb-3">Add Your Review & Rating</h3>
                    <form onsubmit="submitReview(event)" class="space-y-3">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] text-zinc-400 mb-1">Your Name</label>
                                <input type="text" id="reviewName" required placeholder="e.g. MetalHead99" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-red-600">
                            </div>
                            <div>
                                <label class="block text-[11px] text-zinc-400 mb-1">Rating</label>
                                <select id="reviewRating" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-red-600">
                                    <option value="🔥 5/5 - Absolute Masterpiece">🔥 5/5 - Masterpiece</option>
                                    <option value="🤘 4/5 - Heavy Banger">🤘 4/5 - Heavy Banger</option>
                                    <option value="🎸 3/5 - Solid Release">🎸 3/5 - Solid Release</option>
                                    <option value="⚠️ 2/5 - Underwhelming">⚠️ 2/5 - Underwhelming</option>
                                    <option value="🗑️ 1/5 - Skip It">🗑️ 1/5 - Skip It</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] text-zinc-400 mb-1">Your Review / Thoughts</label>
                            <textarea id="reviewComment" rows="3" required placeholder="Share your thoughts on this release..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-red-600"></textarea>
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold transition shadow-md shadow-red-600/20">
                            Post Review
                        </button>
                    </form>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-white mb-3 flex items-center justify-between">
                        <span>Community Reviews (Live Cloud)</span>
                        <span class="text-xs text-zinc-500 mono">(${reviews.length})</span>
                    </h3>
                    <div id="reviewsList" class="space-y-2">
                        ${reviews.length === 0 ? '<p class="text-zinc-500 text-xs text-center py-6 bg-zinc-900/40 rounded-xl border border-zinc-800/50">No reviews yet. Be the first to review this release!</p>' : ''}
                        ${reviews.map((rev) => {
                            const formattedDate = new Date(rev.created_at).toLocaleDateString();
                            return `
                                <details class="group bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden transition">
                                    <summary class="flex items-center justify-between p-3.5 cursor-pointer select-none hover:bg-zinc-800/50">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs text-red-500 mono">
                                                ${rev.name.substring(0,2).toUpperCase()}
                                            </div>
                                            <div>
                                                <span class="text-xs font-bold text-white">${rev.name}</span>
                                                <span class="text-[10px] text-zinc-400 block">${rev.rating}</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <span class="text-[10px] text-zinc-500 mono">${formattedDate}</span>
                                            <svg class="w-4 h-4 text-zinc-500 group-open:rotate-180 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                        </div>
                                    </summary>
                                    <div class="px-4 pb-4 pt-1 text-xs text-zinc-300 border-t border-zinc-800/60 leading-relaxed whitespace-pre-wrap">${rev.comment}</div>
                                </details>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        async function submitReview(event) {
            event.preventDefault();
            const name = document.getElementById('reviewName').value.trim();
            const rating = document.getElementById('reviewRating').value;
            const comment = document.getElementById('reviewComment').value.trim();

            if (!name || !comment) return;

            try {
                const { error } = await supabaseClient
                    .from('reviews')
                    .insert([{ album_id: String(activeAlbumId), name, rating, comment }]);
                
                if (error) {
                    alert('Error posting review: ' + error.message);
                    return;
                }
                openAlbumDetail(activeAlbumId);
            } catch (err) {
                console.error("Error submitting review:", err);
            }
        }

        function backToMain() {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            activeAlbumId = null;
        }

        loadReleases();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
            });
        }
    </script>
</body>
</html>
